# Kafka for the Real-Time Retail Intelligence Platform.
# Single-node Apache Kafka in KRaft mode (no Zookeeper).
#
#   docker compose up -d        # start Kafka
#   docker compose down         # stop (data persists in the kafka-data volume)
#   docker compose down -v      # stop AND wipe all topic data
#
# The producer writes to topic "retail.events"; the Spark job publishes
# fraud alerts to "retail.alerts". Both topics auto-create on first use
# (KAFKA_AUTO_CREATE_TOPICS_ENABLE=true); to create them explicitly see
# docs/runbook.md.
services:
  kafka:
    image: apache/kafka:latest
    container_name: retail-kafka
    hostname: kafka
    ports:
      - "9092:9092"     # host access: localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # EXTERNAL = host-facing (localhost:9092), INTERNAL = docker network
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # single-node: everything replicates to the one broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "5f8c2a1e-7b3d-4e9a-8c1f-2d6b5a4e7c9a1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 5 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  kafka-data:
